services:
  app:
    image: ghcr.io/necsus/overlays:${OVERLAYS_IMAGE_TAG:?Set OVERLAYS_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      # Host Nginx reaches this container through the app_egress gateway.
      # Trust only that observed address, never all clients or Docker subnets.
      FORWARDED_ALLOW_IPS: ${OVERLAYS_PROXY_IP:-172.18.0.1}
      TWITCH_ENABLED: ${TWITCH_ENABLED:-false}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?Set TWITCH_CLIENT_ID in .env}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:?Set TWITCH_CLIENT_SECRET in .env}
      TWITCH_BOT_ID: ${TWITCH_BOT_ID:?Set TWITCH_BOT_ID in .env}
      TWITCH_OWNER_ID: ${TWITCH_OWNER_ID:?Set TWITCH_OWNER_ID in .env}
      TWITCH_BOT_LOGIN: ${TWITCH_BOT_LOGIN:?Set TWITCH_BOT_LOGIN in .env}
      TWITCH_ADMIN_REDIRECT_URI: ${TWITCH_ADMIN_REDIRECT_URI:?Set TWITCH_ADMIN_REDIRECT_URI in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      TWITCH_COMMAND_PREFIX: ${TWITCH_COMMAND_PREFIX:-!}
      PSQL_HOST: postgres
      PSQL_PORT: "5432"
      PSQL_DB: ${PSQL_DB:?Set PSQL_DB in .env}
      PSQL_USER: ${PSQL_USER:?Set PSQL_USER in .env}
      PSQL_PASSWORD: ${PSQL_PASSWORD:?Set PSQL_PASSWORD in .env}
      PSQL_SSLMODE: disable
      GIVEAWAY_CONFIG_FILE: /var/lib/overlays/settings.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - overlays_runtime:/var/lib/overlays
    networks:
      - postgres
      - app_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true

volumes:
  overlays_runtime:

networks:
  postgres:
    external: true
    name: geekom_postgres_clients
  app_egress:
