name: PR validation

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (without publishing)
        run: docker build --pull --tag overlays:ci .
