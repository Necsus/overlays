name: CI and deploy image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (without publishing)
        run: docker build --pull --tag overlays:ci .

  deploy-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-main-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" --password-stdin

      - name: Build and push image to GHCR
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull \
            --tag "$image:sha-$GITHUB_SHA" \
            --tag "$image:main" \
            .
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:main"
