<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gérez vos overlays et giveaways Twitch pour OBS.">
    <meta name="theme-color" content="#101116">
    <title>NecsusDevOverlays — vos overlays Twitch</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f0f1f6;
        background: #101116;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }

      main {
        width: min(100%, 38rem);
        padding: clamp(1.5rem, 6vw, 3rem);
        border: 1px solid #303440;
        border-radius: 1rem;
        background: #181a22;
      }

      .brand {
        margin: 0 0 2.5rem;
        color: #bca3ff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 14ch;
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.25rem);
        letter-spacing: -0.05em;
        line-height: 1.1;
      }

      .description {
        max-width: 36rem;
        margin: 0 0 2rem;
        color: #b1b6c8;
        line-height: 1.7;
      }

      .button {
        display: inline-flex;
        min-height: 2.9rem;
        align-items: center;
        justify-content: center;
        padding: 0.7rem 1rem;
        border-radius: 0.5rem;
        background: #bca3ff;
        color: #201336;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
      }

      .button:hover { background: #cebaff; }
      .button:focus-visible { outline: 2px solid #f0f1f6; outline-offset: 4px; }

      .hint {
        margin: 1rem 0 0;
        color: #8f95a8;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">NecsusDevOverlays</p>
      <h1>Vos overlays, prêts pour le stream.</h1>
      <p class="description">
        Gérez votre giveaway Twitch et retrouvez votre espace streamer pour OBS.
      </p>
      <a class="button" href="/admin">Accéder à l’application</a>
      <p class="hint">Connexion avec Twitch requise.</p>
    </main>
  </body>
</html>
