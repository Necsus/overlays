# Keep application-specific variables and cache zones distinct on the shared host.
map $http_upgrade $overlays_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name overlays.necsus.dev;

    # OAuth callbacks carry short-lived codes in the query string.
    access_log off;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://overlays.necsus.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name overlays.necsus.dev;

    # Avoid logging OAuth callback codes and other sensitive query parameters.
    access_log off;

    ssl_certificate /etc/letsencrypt/live/overlays.necsus.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overlays.necsus.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:overlays_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the only ingress proxy; discard client-supplied forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $overlays_connection_upgrade;
    }
}
