server {
    listen 80;
    server_name overlays.necsus.dev;

    # OAuth callbacks carry short-lived codes in the query string.
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
